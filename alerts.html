<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FinSense Alerts</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/dashboard.css">

</head>

<body class="page-shell">

<header
class="bg-white shadow-md p-6 flex justify-between items-center">

<div>

<h1 class="text-3xl font-bold">

🚨 High Risk Alerts

</h1>

<p class="text-gray-500">

Borrowers requiring immediate attention

</p>

</div>

<button

onclick="window.location='dashboard.html'"

class="btn-brand px-6 py-3 rounded-xl">

<i class="ri-home-line"></i>

Dashboard

</button>

</header>

<div class="p-8">

<div class="bg-white rounded-3xl shadow-lg p-8">

<div class="flex justify-between items-center mb-6">

<h2 class="text-2xl font-bold">

Latest Alerts

</h2>

<select

id="tierFilter"

class="border rounded-lg px-4 py-2">

<option value="all">

All

</option>

<option value="red">

Red

</option>

<option value="orange">

Orange

</option>

<option value="amber">

Amber

</option>

</select>

</div>

<table class="w-full">

<thead>

<tr>

<th>Borrower</th>

<th>Loan</th>

<th>Risk</th>

<th>Tier</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>

<tbody id="alertsTable">

</tbody>

</table>

</div>

</div>

<script type="module" src="js/alerts.js"></script>

</body>

</html>
